name: CI/CD Build & Push Pipeline

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@v2
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: us-east-1

    - name: Log in to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v1

    - name: Build & Push Backend Image
      run: |
        docker build -t ${{ steps.login-ecr.outputs.registry }}/3tier-backend:latest ./app/backend
        docker push ${{ steps.login-ecr.outputs.registry }}/3tier-backend:latest

    - name: Build & Push Frontend Image
      run: |
        docker build -t ${{ steps.login-ecr.outputs.registry }}/3tier-frontend:latest ./app/frontend
        docker push ${{ steps.login-ecr.outputs.registry }}/3tier-frontend:latest
